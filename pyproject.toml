[project]
name = "argus"
version = "0.1.0"
description = "Provider-neutral visual UI testing agents"
license = { text = "Argus Source-Available License 1.0 (ASAL-1.0)" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27.0",
    "mcp>=1.14,<2",
    "playwright>=1.50",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
argus-mcp = "argus.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9",
]
